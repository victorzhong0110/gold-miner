<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>黄金矿工 / Gold Miner</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1>黄金矿工 Gold Miner</h1>
      <p id="subtitle">试验设置页。密钥只存在本机受信上下文。</p>
      <form id="form">
        <label>
          阅读语言 / Reading language
          <select id="readingLang">
            <option value="zh">中文</option>
            <option value="en">English</option>
          </select>
        </label>
        <label>
          兴趣 / Interests（逗号分隔）
          <input id="interests" type="text" maxlength="200" placeholder="clipboard, rss, 自托管" />
        </label>
        <label>
          <input id="personalization" type="checkbox" checked />
          启用个性化 / Enable personalization
        </label>
        <label>
          <input id="historyEnabled" type="checkbox" />
          浏览历史（默认关，需勾选） / Browsing history (off by default)
        </label>
        <fieldset>
          <legend>BYOK</legend>
          <label>OPENAI_BASE_URL <input id="baseUrl" type="url" placeholder="https://api.minimax.cn/v1" /></label>
          <label>OPENAI_MODEL <input id="model" type="text" placeholder="MiniMax-M3" /></label>
          <label>OPENAI_API_KEY <input id="apiKey" type="password" autocomplete="off" /></label>
        </fieldset>
        <div class="actions">
          <button type="submit" id="save">保存 / Save</button>
          <button type="button" id="probe">探测连接 / Test connection</button>
          <button type="button" id="clear">清除本地数据 / Clear local data</button>
          <button type="button" id="export">导出缓存 / Export cache</button>
          <button type="button" id="importBtn">导入缓存 / Import cache</button>
          <input id="importFile" type="file" accept="application/json" hidden />
        </div>
      </form>
      <pre id="status"></pre>
    </main>
    <script src="options.js"></script>
  </body>
</html>
