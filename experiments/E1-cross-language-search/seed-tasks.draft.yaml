## 为什么是草案而不是冻结种子集

- 冻结种子集需要逐条核对：来源、发现日期、stars、用途与能力证据、README 语言标签，并包含低热度材料，且 HelloGitHub 不能是唯一来源。
- 上述核对需要真实来源检查（W2）与原文抓取，W1 未执行网络请求，因此本轮不声称任何种子仓库存在、 stars 数或语言标签。
- 本文件只固定采集位与判定边界，不提供可计入命中率的 `repo`。`entries` 为空是如实状态，不是遗漏。

